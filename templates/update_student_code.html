{% extends "base.html" %}

{% block title %}Uppdatera elevkod{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm">

            <h2 class="mb-4 text-primary">Generera ny inloggningskod</h2>
            <p class="mb-4 text-primary">
                Välj en elev och skapa en ny kod. Den gamla koden slutar fungera direkt.
            </p>

            <form method="POST">

                <!-- VÄLJ STUDENT -->
                <div class="mb-3">
                    <label class="form-label">Elev</label>

                    <select name="student_id" id="student-select" class="form-select" required>
                        <option value="">Välj elev...</option>
                        {% for student in students %}
                            <option value="{{ student.id }}">
                                {{ student.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Generera ny kod
                </button>

            </form>

        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    if (typeof TomSelect === "undefined") {
        console.error("TomSelect laddades inte!");
        return;
    }
    new TomSelect("#student-select");
});
</script>
{% endblock %}
