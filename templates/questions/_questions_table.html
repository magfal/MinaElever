<!-- Frågor -->
<div class="sticky-table-container">
    <table class="table table-hover mb-0 sticky-table">
        <thead>
            <tr>
                <th class="sortable">
                    Fråga
                    <i class="bi bi-chevron-expand ms-1"></i>
                </th>
                <th class="sortable">
                    Skapad
                    <i class="bi bi-chevron-expand ms-1"></i>
                </th>
                <th class="sortable">
                    Svarstyp
                    <i class="bi bi-chevron-expand ms-1"></i>
                </th>
                <th></th>
            </tr>
        </thead>
        <tbody>
        {% for question in questions %}
            <tr>
                <!-- FRÅGA -->
                <td class="question-cell">
                    <div class="question-table-text"></div>
                    <textarea
                        class="question-source d-none"
                        aria-hidden="true"
                    >{{ question.text }}</textarea>
                </td>
                <!-- SKAPAD -->
                <td>
                    {{ question.created_at.strftime("%Y-%m-%d") }}
                </td>
                <!-- SVARSTYP -->
                <td>
                    {{ question.question_type.value }}
                </td>
                <!-- ÄNDRA -->
                <td class="text-end">
                    <a
                        href="{{ url_for(
                            'questions.edit_question',
                            question_id=question.id
                        ) }}"
                        class="btn btn-sm btn-outline-primary">
                        Ändra
                    </a>
                    {% if not question.template_links and not question.responses %}
                        <form
                            method="POST"
                            action="{{ url_for('questions.delete_question', question_id=question.id) }}"
                            class="d-inline"
                            onsubmit="return confirm('Ta bort frågan permanent?');"                        >
                            <button
                                type="submit"
                                class="btn btn-sm btn-outline-danger">
                                Ta bort
                            </button>
                        </form>
                    {% endif %}
                </td>
            </tr>
        {% else %}
            <tr>
                <td
                    colspan="8"
                    class="text-center text-muted py-4">
                    Tom tabell.
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
