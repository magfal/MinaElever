{% extends "base.html" %}
{% block content %}
<div class="container-fluid px-4 py-3">
    <!-- SIDHUVUD (<a> länkar till ny sida)-->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Hantera frågor</h2>
        <a
            class="btn btn-primary"   
            href="{{ url_for('questions.new_form') }}">
            Ny fråga
        </a>
    </div>
    <!-- SÖKFILTER -->
    <form
        class="row g-3 mb-3"
        method="get"    
        hx-get="{{ url_for('questions.manage') }}"
        hx-target="#questionsTable"
        hx-swap="innerHTML"
        hx-trigger="
            change from:select,
            change from:input[type=date],
            keyup changed from:#search-input delay:250ms
        "
        hx-push-url="true">
        <!-- Sök -->
        <div class="col-12 col-md-4">
            <label
                for="search-input"
                class="form-label">
                Sök frågor
            </label>
            <input
                class="form-control"    
                id="search-input"                
                type="search"
                name="search"
                value="{{ request.args.get('search', '') }}"
                placeholder="...">
        </div>
        <!-- Tagg -->
        <div class="col-12 col-md-3 col-lg-2">
            <label class="form-label">
                Tagg
            </label>
            <select
                class="form-select tomselect-filter"
                name="tag_id">
                <option value="">
                    Alla taggar
                </option>
                {% for tag_type in tag_types %}
                    <optgroup label="{{ tag_type.value }}">
                        {% for tag in tags if tag.tag_type == tag_type %}
                            <option value="{{ tag.id }}">
                                {{ tag.name }}
                            </option>
                        {% endfor %}
                    </optgroup>
                {% endfor %}
            </select>
        </div>
        <!-- Svarstyp -->
        <div class="col-12 col-md-3 col-lg-2">
            <label class="form-label">
                Svarstyp
            </label>
            <select
                class="form-select"
                name="question_type">
                <option value="">
                    Alla svarstyper
                </option>
                {% for question_type in question_types %}
                    <option
                        value="{{ question_type.name }}"
                        {% if question_type == question_type.name %}
                            selected
                        {% endif %}>
                        {{ question_type.value }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <!-- Tid (från) -->
        <div class="col-12 col-md-2">
            <label for="dateFrom" class="form-label">
                Från
            </label>
            <input
                type="date"
                id="dateFrom"
                name="date_from"
                class="form-control"
                value="{{ date_from  }}">
        </div>
        <!-- Tid (till) -->
        <div class="col-16 col-md-2">
            <label for="dateTo" class="form-label">
                Till
            </label>
            <input
                type="date"
                id="dateTo"
                name="date_to"
                class="form-control"
                value="{{ date_to }}">
        </div>
    </form>
    <!-- TABELL -->
    <div class="card mb-4">
        <div class="card-body p-0" id="questionsTable">
            {% include "questions/_questions_table.html" %}
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{% endblock %}
