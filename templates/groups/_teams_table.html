    <!-- Grupper -->
            <table class="table table-hover mb-0">
                <colgroup>
                    <col style="width: 20%">
                    <col style="width: 20%">
                    <col style="width: 40%">
                    <col style="width: 20%">
                </colgroup>
                <thead>
                    <tr>
                        <th>Namn</th>
                        <th>Elever</th>
                        <th>Beskrivning</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    {% if teams %}
                        {% for team in teams %}
                        <tr>
                            <td>
                                {{ team.name }}
                            </td>
                            <td>
                                {{ team.students|length }}
                            </td>
                            <td>
                                {{ team.description or "" }}
                            </td>
                            <td class="text-end">
                                <button
                                    class="btn btn-sm btn-outline-secondary"
                                    hx-get="{{ url_for('groups.list_modal', entity_type='team', entity_id=team.id) }}"
                                    hx-target="#groupModalContent"
                                    hx-swap="innerHTML"
                                    data-bs-toggle="modal"
                                    data-bs-target="#groupModal">
                                    Visa
                                </button>
                                <button
                                    class="btn btn-sm btn-outline-primary edit-team-btn"
                                    hx-get="{{ url_for('groups.edit_team_modal', team_id=team.id) }}"
                                    hx-target="#teamModalContent"
                                    hx-swap="innerHTML"
                                    data-bs-toggle="modal"
                                    data-bs-target="#teamModal">
                                    Ändra
                                </button>
                                {% if team.students|length == 0 %}
                                    <form method="POST"
                                        action="{{ url_for('groups.delete_team', team_id=team.id) }}"
                                        class="d-inline"
                                        onsubmit="return confirm('Ta bort gruppen permanent?');">
                                        <button
                                            class="btn btn-sm btn-outline-danger">
                                            Ta bort
                                        </button>
                                    </form>
                                {% endif %}
                            </td>
                        </tr>
                        {% endfor %}
                    {% else %}
                        <tr>
                            <td colspan="4" class="text-center text-muted">
                            Tom tabell.
                            </td>
                        </tr>
                    {% endif %}
                </tbody>
            </table>
