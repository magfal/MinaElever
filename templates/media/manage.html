{% extends "base.html" %}
{% block content %}
<div class="container-fluid px-4 py-3">
    <!-- SIDHUVUD (<form> submittar fil)-->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"> Hantera bilder </h2>
        <form 
            method="post" 
            action="{{ url_for('media.upload') }}" 
            enctype="multipart/form-data">
            <label for="mediaFile" class="btn btn-primary mb-0"> 
                Ladda upp bild 
            </label>
            <input type="file" 
                class="d-none"     
                id="mediaFile" 
                name="image" 
                accept="image/jpeg,image/png,image/webp" 
                onchange="this.form.submit()">
        </form>
    </div>
    <!-- SÖKFILTER -->
    <form
        class="row g-3 mb-3"    
        method="get"
        hx-get="{{ url_for('media.grid') }}"
        hx-target="#media-grid"
        hx-swap="innerHTML"
        hx-trigger="
                change from:select,
                change from:input[type=date],
                keyup changed from:#search-input delay:250ms
            "
        hx-push-url="true">
        <!-- Sök -->
        <div class="col-12 col-md-4">
            <label for="searchName" class="form-label">
                Sök bilder
            </label>
            <input
                class="form-control"    
                id="search-input"
                type="search"
                name="search"
                value="{{ search }}"
                placeholder="...">
        </div>
        <!-- Taggtyp -->
        <div class="col-12 col-md-4">
            <label for="searchTags" class="form-label">
                Taggar
            </label>
            <select
                id="searchTags"
                name="tag_ids"
                class="form-select tomselect-filter"
                multiple>
                {% for tag_type in tag_types %}
                    <optgroup label="{{ tag_type.value }}">
                        {% for tag in tags if tag.tag_type == tag_type %}
                            <option
                                value="{{ tag.id }}"
                                {% if tag.id|string in selected_tag_ids %}
                                    selected
                                {% endif %}>
                                {{ tag.name }}
                            </option>
                        {% endfor %}
                    </optgroup>
                {% endfor %}
            </select>
        </div>
        <!-- Tid (från) -->
        <div class="col-12 col-md-2">
            <label for="dateFrom" class="form-label">
                Från
            </label>
            <input
                type="date"
                id="dateFrom"
                name="date_from"
                class="form-control"
                value="{{ date_from  }}">
        </div>
        <!-- Tid (till) -->
        <div class="col-16 col-md-2">
            <label for="dateTo" class="form-label">
                Till
            </label>
            <input
                type="date"
                id="dateTo"
                name="date_to"
                class="form-control"
                value="{{ date_to }}">
        </div>
    </form>
    <!-- Senast uppladdade bilder -->
    <div class="card">
        <div class="card-body">
            <div id="media-grid" class="row g-4">
                {% set selectable = false %}
                {% set media_manage = true %}
                {% include "media/_grid.html" %}
            </div>  
        </div>
    </div>
</div>
<!-- Modal för redigering av media -->
<div
    class="modal fade"
    id="editMediaModal"
    tabindex="-1"
    aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form
                id="editMediaForm"
                method="post">
                <div class="modal-header">
                    <h5 class="modal-title">
                        Redigera bild
                    </h5>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Stäng">
                    </button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label
                            for="mediaName"
                            class="form-label">
                            Namn
                        </label>
                        <input
                            type="text"
                            id="mediaName"
                            name="name"
                            class="form-control"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="mediaTags" class="form-label">
                            Taggar
                        </label>
                        <div
                            id="mediaTagBadges"
                            class="media-tag-badges mb-3">
                        </div>
                        <div class="input-group">
                            <select
                                id="mediaTags"
                                name="tag_ids"
                                class="form-select tomselect-filter"
                                multiple>
                                {% for tag_type in tag_types %}
                                    <optgroup label="{{ tag_type.value }}">
                                        {% for tag in tags
                                            if tag.tag_type == tag_type %}
                                            <option
                                                value="{{ tag.id }}"
                                                data-tag-type="{{ tag.tag_type.name }}">
                                                {{ tag.name }}
                                            </option>
                                        {% endfor %}
                                    </optgroup>
                                {% endfor %}
                            </select>
                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                id="addMediaTagBtn"
                                data-url="{{ url_for('tags.create_media_tag_modal') }}"
                                disabled>
                                Lägg till
                            </button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button
                        type="submit"
                        class="btn btn-primary">
                        Spara
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<div
    class="modal fade"
    id="mediaTagModal"
    tabindex="-1"
    aria-hidden="true">
    <div class="modal-dialog modal-sm">
        <div
            class="modal-content"
            id="mediaTagModalContent">
        </div>
    </div>
</div>
{% endblock %}
