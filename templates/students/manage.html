{% extends "base.html" %}
{% block content %}
<div class="container-fluid px-4 py-3">
<!-- SIDHUVUD -->
    <div class="d-flex justify-content-between align-items-center">
        <h2 class="mb-0">Hantera elever</h2>
        <div class="d-flex gap-2">
            <a
                href="{{ url_for('students.add') }}"
                class="btn btn-primary">
                Nya elever
            </a>
    </div>
</div>
<!-- SÖKFILTER FÖR STUDENTTABELL -->
<div class="row mb-3">
    <form 
        hx-get="{{ url_for('students.manage') }}"
        hx-target="#studentsTable"
        hx-swap="innerHTML"
        hx-trigger="change, keyup changed delay:200ms"
        hx-push-url="true"
        class="row g-3">
        <div class="col-12 col-md-5">
            <label class="form-label">Sök elev</label>
            <input
                class="form-control"
                type="search"
                name="search"
                value="{{ request.args.get('search', '') }}"
                placeholder="Skriv namn...">
        </div>
        <div class="col-12 col-md-3">
            <label class="form-label">Klasser</label>
            <select 
                class="form-select" 
                name="group_id">
                <option value="">Alla klasser</option>
                {% for group in groups %}
                    <option 
                        value="{{ group.id }}"
                        {% if group.id == request.args.get('selected_group_id') %}
                            selected
                        {% endif %}>
                        {{ group.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-12 col-md-3">
            <label class="form-label">Grupper</label>
            <select 
                class="form-select" 
                name="team_id">
                <option value="">Alla grupper</option>
                {% for team in teams %}
                    <option value="{{ team.id }}"
                        {% if team.id == request.args.get('selected_team_id') %}
                            selected
                        {% endif %}>
                        {{ team.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-12 col-md-1">
            <label class="form-label d-block">
                Arkiverade
            </label>
            <div class="form-check d-flex justify-content-center">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="include_inactive"
                    value="true"
                    id="includeInactive"
                    {% if request.args.get('include_inactive') %}
                        checked
                    {% endif %}>
            </div>
        </div>
    </form>
</div>
<!-- TABELL --> 
<div class="card mb-4">
    <div class="card-body p-0" id="studentsTable">
        {% include "students/_students_table.html" %}
    </div>
</div>
    <!--Popup-fönster (modaler)-->
    {% include "students/_student_modal.html" %}
{% endblock %}

{% block scripts %}
{% endblock %}
