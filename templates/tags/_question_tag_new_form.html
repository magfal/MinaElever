<form
    id="questionTagForm"
    hx-post="{{ url_for('tags.create_question_tag') }}"
    hx-target="#questionTagModalContent"
    hx-swap="none">

    <div class="modal-header">
        <h5 class="modal-title">
            Lägg till tagg
        </h5>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Stäng">
        </button>
    </div>

    <div class="modal-body">

        <div class="mb-3">
            <label
                for="questionTagName"
                class="form-label">
                Namn
            </label>

            <input
                type="text"
                class="form-control"
                id="questionTagName"
                name="name"
                value="{{ name }}"
                required
                maxlength="50">
        </div>

        <div class="mb-3">
            <label
                for="questionTagType"
                class="form-label">
                Taggtyp
            </label>    

            <select
                class="form-select"
                id="questionTagType"
                name="tag_type"
                required>

                {% for tag_type in tag_types %}
                    <option value="{{ tag_type.name }}">
                        {{ tag_type.value }}
                    </option>
                {% endfor %}

            </select>
        </div>
    </div>

    <div class="modal-footer">
        <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal">
            Avbryt
        </button>

        <button
            type="submit"
            class="btn btn-primary">
            Lägg till
        </button>
    </div>

</form>
