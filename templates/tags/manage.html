{% extends "base.html" %}
{% block content %}
<div class="container-fluid px-4 py-3">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Hantera taggar</h2>
        <button
            class="btn btn-primary"
            hx-get="{{ url_for('tags.new_tag_modal') }}"
            hx-target="#tagModalContent"
            hx-swap="innerHTML"
            data-bs-toggle="modal"
            data-bs-target="#tagModal">
            Nya taggar
        </button>
        </div>
    </div>
</div>
<div class="card mb-4">
    <div class="card-header">
        <h5 class="mb-0">
            Taggar
        </h5>
    </div>
    <div class="card-body p-0" id="tagsTable">
        {% include "tags/_tags_table.html" %}
    </div>
</div>
<!--Popup-fönster (modaler)-->
    {% include "tags/_tag_modal.html" %}

{% endblock %}

{% block scripts %}
{% endblock %}
