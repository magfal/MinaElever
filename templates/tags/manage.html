{% extends "base.html" %}
{% block content %}
<div class="container-fluid px-4 py-3">
    <!-- SIDHUVUD -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Hantera taggar</h2>
        <button
            class="btn btn-primary"
            hx-get="{{ url_for('tags.new_tag_modal') }}"
            hx-target="#tagModalContent"
            hx-swap="innerHTML"
            data-bs-toggle="modal"
            data-bs-target="#tagModal">
            Nya taggar
        </button>   
    </div>
    <div class="row mb-3">
        <form 
            hx-get="{{ url_for('tags.manage') }}"
            hx-target="#tagsTable"
            hx-swap="innerHTML"
            hx-trigger="change"
            hx-push-url="true"
            class="row g-3">
            <div class="col-12 col-md-3">
                <label class="form-label">
                    Taggtyp
                </label>
                <select
                    class="form-select"
                    name="tag_type">
                    <option value="">
                        Alla taggtyper
                    </option>
                    {% for tag_type in tag_types %}
                        <option
                            value="{{ tag_type.name }}"
                            {% if request.args.get('tag_type') == tag_type.name %}
                                selected
                            {% endif %}>
                            {{ tag_type.value }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </form>
    </div>
    <div class="card mb-4">
        <div class="card-body p-0" id="tagsTable">
            {% include "tags/_tags_table.html" %}
        </div>
    </div>
</div>
<!--Popup-fönster (modaler)-->
    {% include "tags/_tag_modal.html" %}

{% endblock %}

{% block scripts %}
{% endblock %}
