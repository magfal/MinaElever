{% extends "base.html" %}
{% block content %}
<div class="container-fluid px-3 py-3">
    <!-- SIDHUVUD (<a> länkar till ny sida) -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Hantera uppgifter</h2>
        <a
            href="{{ url_for('assignments.new') }}"
            class="btn btn-primary">
            Lägg till uppgift
        </a>
    </div>
    <!-- SÖKFILTER -->
    <form
        class="row g-3 mb-3"
        method="get"
        hx-get="{{ url_for('assignments.manage') }}"
        hx-target="#assignmentsTable"
        hx-swap="innerHTML"
        hx-trigger="
                change from:select,
                change from:input[type=date],
                keyup changed from:#search-input delay:250ms
            "
        hx-push-url="true">
        <!-- Sök -->
        <div class="col-12 col-md-4">
            <label for="assignmentSearch" class="form-label">
                Sök uppgifter
            </label>
            <input
                class="form-control"     
                id="search-input"
                type="search"
                name="search"
                value="{{ search }}"
                placeholder="...">
        </div>
        <div class="col-12 col-md-2">
            <label
                for="assignmentType"
                class="form-label">
                Uppgiftstyp
            </label>
            <select
                id="assignmentType"
                name="assignment_type"
                class="form-select">
                <option value="">Alla typer</option>
                {% for assignment_type in assignment_types %}
                    <option
                        value="{{ assignment_type.name }}"
                        {% if assignment_type.name == selected_assignment_type %}selected{% endif %}>
                        {{ assignment_type.value }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-12 col-md-2">
            <label
                for="assignmentStatus"
                class="form-label">
                Status
            </label>
            <select
                id="assignmentStatus"
                name="status"
                class="form-select">
                <option value="">
                    Alla
                </option>
                <option value="Förberedd"
                    {% if status == "Förberedd" %}selected{% endif %}>
                    Förberedd
                </option>
                <option value="Pågående"
                    {% if status == "Pågående" %}selected{% endif %}>
                    Pågående
                </option>
                <option value="Avslutad"
                    {% if status == "Avslutad" %}selected{% endif %}>
                    Avslutad
                </option>
            </select>
        </div>
        <!-- Tid (från) -->
        <div class="col-12 col-md-2 ms-md-auto">
            <label for="dateFrom" class="form-label">
                Från
            </label>
            <input
                type="date"
                id="dateFrom"
                name="date_from"
                class="form-control"
                value="{{ date_from  }}">
        </div>
        <!-- Tid (till) -->
        <div class="col-16 col-md-2">
            <label for="dateTo" class="form-label">
                Till
            </label>
            <input
                type="date"
                id="dateTo"
                name="date_to"
                class="form-control"
                value="{{ date_to }}">
        </div>
    </form>
    <!-- TABELL -->
    <div id="assignmentsTable">
        {% include "assignments/_assignments_table.html" %}
    </div>
</div>
{% endblock %}
