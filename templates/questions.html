{% extends "base.html" %}
{% block content %}

<div class="container mt-4" x-data="{ showNewRow: false }">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h4>Frågor</h4>
            <button @click="showNewRow = true" class="btn btn-primary">Skapa ny fråga</button>
        </div>

        <div class="p-3 bg-light border-bottom">
            <input type="text" 
                   name="text"
                   class="form-control" 
                   placeholder="Fuzzy search på frågor eller taggar..."
                   hx-get="/admin/search_questions_table"
                   hx-trigger="keyup changed delay:300ms"
                   hx-target="#question-tbody">
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Fråga</th>
                        <th>Ämne</th>
                        <th>Taggar</th>
                        <th>Typ</th>
                        <th>Skapad</th>
                        <th>Åtgärd</th>
                    </tr>
                    <tr class="filter-row">
                        <th><input type="text" class="form-control form-control-sm col-search" placeholder="Sök text..."></th>
                        <th>
                            <select class="form-select form-select-sm col-search">
                                <option value="">Alla</option>
                                {% for s in subjects %}<option value="{{ s.name }}">{{ s.name }}</option>{% endfor %}
                            </select>
                        </th>
                        <th><input type="text" class="form-control form-control-sm col-search" placeholder="Sök tagg..."></th>
                        <th>
                            <select class="form-select form-select-sm col-search">
                                <option value="">Alla</option>
                                {% for qt in question_types %}<option value="{{ qt.name }}">{{ qt.name }}</option>{% endfor %}
                            </select>
                        </th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="question-tbody">
                    {% include "partials/question_rows.html" %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('tagEditor', (initialTags, questionId) => ({
            tags: initialTags,
            newTag: '',
            addTag() {
                if (this.newTag.trim() && !this.tags.includes(this.newTag)) {
                    this.tags.push(this.newTag.trim());
                    this.save();
                }
                this.newTag = '';
            },
            removeTag(index) {
                this.tags.splice(index, 1);
                this.save();
            },
            save() {
                fetch('/admin/update_tags', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: questionId, tags: this.tags.join(',') })
                });
            }
        }))
    })
</script>
{% endblock %}
