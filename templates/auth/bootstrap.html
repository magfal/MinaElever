<h1>Skapa första läraren</h1>
<form method="POST">
    <div>
        <label>Namn</label>
        <input 
            name="name"
            required>
    </div>
    <div>
        <label>Login-kod</label>
        <input 
            name="login_code"
            required>
    </div>
    <button type="submit">
        Skapa lärare
    </button>
</form>
